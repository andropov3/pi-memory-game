<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pi Memory Game</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      padding-top: 20px;
    }
    .login-section {
      margin: 20px;
    }
    #pi-login {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #8b5cf6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #username-display {
      margin-top: 10px;
      font-weight: bold;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 10px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 80px;
      height: 80px;
      background-color: #ddd;
      font-size: 24px;
      line-height: 80px;
      cursor: pointer;
      border-radius: 8px;
      user-select: none;
    }
    .matched {
      background-color: #6ee7b7;
      cursor: default;
    }
  </style>
  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Pi Memory Game</h1>
  <div class="login-section">
    <button id="pi-login">Login with Pi</button>
    <div id="username-display"></div>
  </div>
  <div class="game-board" id="game-board"></div>

  <script>
    const digits = "3141592653589793".split(""); // 8 unique pairs = 16 cards
    let cards = [...digits, ...digits];
    cards = cards.sort(() => 0.5 - Math.random());

    const board = document.getElementById("game-board");
    let flippedCards = [];
    let matchedIndexes = [];

    function renderBoard() {
      board.innerHTML = "";
      cards.forEach((digit, index) => {
        const card = document.createElement("div");
        card.className = "card";
        if (matchedIndexes.includes(index)) {
          card.classList.add("matched");
          card.innerText = digit;
        } else if (flippedCards.includes(index)) {
          card.innerText = digit;
        } else {
          card.innerText = "";
        }

        card.addEventListener("click", () => handleCardClick(index));
        board.appendChild(card);
      });
    }

    function handleCardClick(index) {
      if (flippedCards.length < 2 && !flippedCards.includes(index) && !matchedIndexes.includes(index)) {
        flippedCards.push(index);
        renderBoard();

        if (flippedCards.length === 2) {
          setTimeout(() => {
            const [i1, i2] = flippedCards;
            if (cards[i1] === cards[i2]) {
              matchedIndexes.push(i1, i2);
            }
            flippedCards = [];
            renderBoard();

            if (matchedIndexes.length === cards.length) {
              setTimeout(() => alert("🎉 You matched all digits of Pi!"), 200);
            }
          }, 700);
        }
      }
    }

    renderBoard();
  </script>

  <!-- Pi Login Script -->
  <script>
    Pi.init({ version: "2.0" });
    const scopes = ['username'];

    document.getElementById("pi-login").addEventListener("click", async () => {
      try {
        const result = await Pi.authenticate(scopes, onIncompletePaymentFound);
        document.getElementById("username-display").innerText = "Welcome, " + result.user.username + "!";
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    });

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found", payment);
    }
  </script>
</body>
</html>
