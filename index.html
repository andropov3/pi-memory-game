<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Memory Game</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f4f8;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 1rem;
      color: #333;
    }
    #pi-login {
      margin: 1rem auto;
      padding: 0.5rem 1rem;
      background: #ffcc00;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 10px;
      justify-content: center;
      margin-top: 2rem;
    }
    .card {
      width: 80px;
      height: 80px;
      background-color: #ccc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }
    .flipped {
      background-color: #4caf50;
      color: white;
    }
    #status {
      margin-top: 1rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>🧠 Pi Digits Memory Game</h1>
  <button id="pi-login">Login with Pi</button>
  <div id="status">Match the digits of Pi!</div>
  <div id="game-board"></div>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Pi Login
    document.getElementById('pi-login').addEventListener('click', () => {
      Pi.init({ version: "2.0" });
      Pi.authenticate(["username"], function(authData) {
        document.getElementById("status").textContent = `Welcome, @${authData.user.username}! Start matching digits!`;
        document.getElementById("pi-login").style.display = "none";
      }, function(error) {
        alert("Pi Login failed: " + error);
      });
    });

    // Memory Game Logic with digits of Pi
    const piDigits = ['3','1','4','1','5','9','2','6'];
    const deck = [...piDigits, ...piDigits].sort(() => Math.random() - 0.5);
    const board = document.getElementById('game-board');
    let firstCard = null;
    let lock = false;
    let matches = 0;

    deck.forEach((digit, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.digit = digit;
      card.dataset.index = index;
      card.addEventListener('click', () => {
        if (lock || card.classList.contains('flipped')) return;
        card.textContent = digit;
        card.classList.add('flipped');

        if (!firstCard) {
          firstCard = card;
        } else {
          lock = true;
          setTimeout(() => {
            if (card.dataset.digit === firstCard.dataset.digit) {
              matches++;
              if (matches === piDigits.length) {
                document.getElementById('status').textContent = '🎉 You matched all Pi digits!';
              }
            } else {
              card.classList.remove('flipped');
              card.textContent = '';
              firstCard.classList.remove('flipped');
              firstCard.textContent = '';
            }
            firstCard = null;
            lock = false;
          }, 700);
        }
      });
      board.appendChild(card);
    });
  </script>
</body>
</html>
