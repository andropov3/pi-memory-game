<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pi Memory Game</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Pi Memory Game</h1>
  <p>Match the digits of Pi!</p>
  <div class="game-board" id="gameBoard"></div>

  <footer>
    <p>
      By playing, you agree to our
      <a href="privacy-policy.html" target="_blank">Privacy Policy</a> and
      <a href="terms-of-service.html" target="_blank">Terms of Service</a>.
    </p>
  </footer>

  <script>
    // Pi Network login
    window.addEventListener("load", function () {
      if (window.Pi) {
        Pi.authenticate(["username"], function (user) {
          console.log("Pi login successful:", user);
          alert("Welcome, " + user.username + "!");
        }, function (error) {
          console.error("Pi login failed:", error);
        });
      } else {
        console.warn("Pi SDK not found");
      }
    });

    // Game logic
    const digitsOfPi = ['3', '1', '4', '1', '5', '9', '2', '6'];
    const cards = [...digitsOfPi, ...digitsOfPi];
    let flippedCards = [];
    let matchedCards = [];

    function shuffle(array) {
      return array.sort(() => 0.5 - Math.random());
    }

    function createCard(value) {
      const card = document.createElement("div");
      card.classList.add("card");
      card.dataset.value = value;
      card.textContent = "?";
      card.addEventListener("click", () => flipCard(card));
      return card;
    }

    function flipCard(card) {
      if (
        flippedCards.length < 2 &&
        !flippedCards.includes(card) &&
        !matchedCards.includes(card)
      ) {
        card.textContent = card.dataset.value;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          checkMatch();
        }
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      if (card1.dataset.value === card2.dataset.value) {
        matchedCards.push(card1, card2);
        flippedCards = [];
        if (matchedCards.length === cards.length) {
          setTimeout(() => alert("🎉 You've matched all digits of Pi!"), 300);
        }
      } else {
        setTimeout(() => {
          card1.textContent = "?";
          card2.textContent = "?";
          flippedCards = [];
        }, 1000);
      }
    }

    function initGame() {
      const gameBoard = document.getElementById("gameBoard");
      gameBoard.innerHTML = "";
      const shuffledCards = shuffle(cards);
      shuffledCards.forEach((value) => {
        const card = createCard(value);
        gameBoard.appendChild(card);
      });
    }

    initGame();
  </script>
</body>
</html>
